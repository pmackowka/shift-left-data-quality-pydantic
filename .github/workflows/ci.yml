name: CI

on:
  pull_request:
  push:
    branches: [main]

# Projekt demonstracyjny: CI tylko weryfikuje jakosc, nigdy nie wdraza.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not slow" --cov --cov-report=term-missing

# ============================================================================
# dq-pipeline - kod obu pipeline'ów: walidacja, zapis, usługa ingest, publisher.
#
# To jest warstwa „chmurowa" z CLAUDE.md: tu wolno zależeć od GCP, w dq-contracts
# nie. Podział chroni kontrakt przed ciągnięciem za sobą gRPC i klientów Google
# do każdego miejsca, które chce tylko zwalidować rekord.
#
# Jeden pakiet zamiast osobnego na ingest, publisher i loader batchowy: wszystkie
# trzy idą do jednego obrazu kontenera (usługa Cloud Run i Cloud Run Job różnią się
# tylko poleceniem startowym), więc osobne pakiety dawałyby trzy pliki pyproject
# do pilnowania bez żadnej korzyści przy wdrożeniu.
# ============================================================================

[project]
name = "dq-pipeline"
version = "0.1.0"
description = "Streaming and batch pipelines enforcing the dq-contracts purchase event contract."
requires-python = ">=3.12"
dependencies = [
    # Celowo BRAK dq-datagen. Generator to narzędzie deweloperskie i nie ma prawa
    # trafić do obrazu produkcyjnego; pipeline czyta pliki NDJSON, nie woła generatora.
    "dq-contracts",
    # Usługa ingest: FastAPI waliduje kopertę Pub/Sub tym samym pydantic, którym
    # stoi kontrakt, więc całe wejście HTTP jest opisane modelami, a nie ręcznym
    # parsowaniem słownika.
    "fastapi>=0.142",
    # Serwer ASGI. Cloud Run uruchamia kontener i wysyła ruch na port z $PORT -
    # uvicorn jest tym, co na tym porcie słucha.
    "uvicorn>=0.54",
    # Konfiguracja z zmiennych środowiskowych. Cloud Run konfiguruje kontener
    # wyłącznie przez env, a pydantic-settings daje temu walidację typów - literówka
    # w zmiennej kończy start usługi błędem zamiast cichej wartości domyślnej.
    "pydantic-settings>=2.15",
    # Oficjalny klient Pub/Sub: publisher, konfiguracja tematów i redrive z dead-letter.
    # Ten sam klient rozmawia z emulatorem i z chmurą - przełącza go wyłącznie zmienna
    # PUBSUB_EMULATOR_HOST, więc kod nie ma osobnej ścieżki „lokalnej".
    "google-cloud-pubsub>=2.41",
]

[project.optional-dependencies]
# DuckDB tylko do raportów z plików lokalnych. Opcjonalna, bo usługa ingest na Cloud Run
# niczego nie raportuje - obraz produkcyjny instaluje pakiet bez tego dodatku.
report = ["duckdb>=1.5"]

[project.scripts]
# Polecenie startowe obrazu usługi ingest (CMD w Dockerfile).
dq-ingest = "dq_pipeline.ingest:main"
dq-pubsub = "dq_pipeline.pubsub:main"
dq-report = "dq_pipeline.report:main"
# Loader batchowy - na GCP polecenie startowe Cloud Run Job na tym samym obrazie co ingest.
dq-batch = "dq_pipeline.batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_pipeline"]

[tool.uv.sources]
dq-contracts = { workspace = true }

[project]
name = "dq-contracts"
version = "0.1.0"
description = "Versioned pydantic data contracts for ecommerce purchase events."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_contracts"]
